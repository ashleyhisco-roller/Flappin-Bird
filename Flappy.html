<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Bird Deluxe - Eggs Edition</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      background: #70c5ce;
      display: block;
      image-rendering: pixelated;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="600"></canvas>

      { id: "seagull", name: "Seagull", rarity: "Common", multiplier: 1.0,

      { id: "magpie", name: "Magpie", rarity: "Uncommon", multiplier: 1.2,
        sprite: { body:"#ffffff", wing:"#000000", beak:"#333333", eye:"#ffffff", pupil:"#000000", accent:"#4fc3f7" } },

      { id: "woodpecker", name: "Woodpecker", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#ffffff", wing:"#000000", beak:"#ffcc33", eye:"#ffffff", pupil:"#000000", accent:"#ff1744" } },
      { id: "chickadee", name: "Chickadee", rarity: "Uncommon", multiplier: 1.2,
        sprite: { body:"#d7ccc8", wing:"#8d6e63", beak:"#333333", eye:"#000000", pupil:"#000000", accent:"#bcaaa4" } },
      { id: "kingfisher", name: "Kingfisher", rarity: "Mythic", multiplier: 7.0,
        sprite: { body:"#0288d1", wing:"#01579b", beak:"#ff6f00", eye:"#ffffff", pupil:"#000000", accent:"#00bcd4" } },
      { id: "hawk", name: "Hawk", rarity: "Rare", multiplier: 1.5,

      { id: "owl", name: "Owl", rarity: "Legendary", multiplier: 4.0,

      { id: "heron", name: "Heron", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#cfd8dc", wing:"#90a4ae", beak:"#ffb300", eye:"#ffffff", pupil:"#000000", accent:"#b0bec5" } },
      { id: "stork", name: "Stork", rarity: "Epic", multiplier: 2.0,
        sprite: { body:"#ffffff", wing:"#cfd8dc", beak:"#ff7043", eye:"#000000", pupil:"#000000", accent:"#eceff1" } },
      { id: "dove", name: "Dove", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#f5f5f5", wing:"#e0e0e0", beak:"#ffb300", eye:"#000000", pupil:"#000000", accent:"#eeeeee" } },

      { id: "parrot", name: "Parrot", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#00c853", wing:"#009624", beak:"#ff6d00", eye:"#ffffff", pupil:"#000000", accent:"#ff1744" } },
      { id: "macaw", name: "Macaw", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#1976d2", wing:"#0d47a1", beak:"#ffb300", eye:"#ffffff", pupil:"#000000", accent:"#ff5252" } },
      { id: "toucan", name: "Toucan", rarity: "Epic", multiplier: 2.0,
        sprite: { body:"#000000", wing:"#212121", beak:"#ffca28", eye:"#ffffff", pupil:"#000000", accent:"#ff7043" } },
      { id: "peacock", name: "Peacock", rarity: "Epic", multiplier: 2.0,
        sprite: { body:"#00695c", wing:"#004d40", beak:"#ffb300", eye:"#ffffff", pupil:"#000000", accent:"#26c6da" } },
      { id: "flamingo", name: "Flamingo", rarity: "Epic", multiplier: 2.0,
        sprite: { body:"#ff80ab", wing:"#f06292", beak:"#ffffff", eye:"#000000", pupil:"#000000", accent:"#ff4081" } },
      { id: "hummingbird", name: "Hummingbird", rarity: "Mythic", multiplier: 7.0,
        sprite: { body:"#00c853", wing:"#009624", beak:"#ffb300", eye:"#ffffff", pupil:"#000000", accent:"#00e5ff" } },
      { id: "kiwi", name: "Kiwi", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#6d4c41", wing:"#4e342e", beak:"#ffb300", eye:"#000000", pupil:"#000000", accent:"#8d6e63" } },
      { id: "puffin", name: "Puffin", rarity: "Mythic", multiplier: 7.0,
        sprite: { body:"#000000", wing:"#212121", beak:"#ff7043", eye:"#ffffff", pupil:"#000000", accent:"#ffffff" } },
      { id: "swan", name: "Swan", rarity: "Epic", multiplier: 2.0,
        sprite: { body:"#ffffff", wing:"#e0e0e0", beak:"#ffb300", eye:"#000000", pupil:"#000000", accent:"#f5f5f5" } },
      { id: "cockatoo", name: "Cockatoo", rarity: "Rare", multiplier: 1.5,
        sprite: { body:"#ffffff", wing:"#eeeeee", beak:"#555555", eye:"#000000", pupil:"#000000", accent:"#fff176" } }
    ];

    // ---------- Eggs (pixel style) ----------
    function drawEggForPack(packKey, cx, cy, crackLevel, shakeOffset) {
      ctx.save();
      ctx.translate(cx + shakeOffset, cy);

      function eggBase(color, spotsColor) {
        ctx.fillStyle = color;
        // Body stack (blocky egg)
        ctx.fillRect(-14, -20, 28, 40);
        ctx.fillRect(-12, -22, 24, 4);
        ctx.fillRect(-10, -24, 20, 4);
        ctx.fillRect(-8, -26, 16, 4);
        ctx.fillRect(-6, -28, 12, 4);

        // Spots
        ctx.fillStyle = spotsColor;
        ctx.fillRect(-6, -10, 4, 4);
        ctx.fillRect(4, -4, 4, 4);
        ctx.fillRect(-2, 6, 4, 4);
      }

      if (packKey === "common") {
        eggBase("#f5f5f5", "#b0bec5");
      } else if (packKey === "forest") {
        eggBase("#e8f5e9", "#66bb6a");
      } else if (packKey === "exotic") {
        eggBase("#e3f2fd", "#42a5f5");
      } else if (packKey === "legendary") {
        eggBase("#fff8e1", "#ffca28");
      } else if (packKey === "ultra") {
        eggBase("#212121", "#00e5ff");
      }

      // Pixelated cracks (no curves)
      if (crackLevel > 0) {
        ctx.fillStyle = "#000000";
        // Top zig-zag crack
        ctx.fillRect(-8, -6, 4, 2);
        ctx.fillRect(-4, -4, 4, 2);
        ctx.fillRect(0, -6, 4, 2);
        ctx.fillRect(4, -4, 4, 2);
        ctx.fillRect(8, -6, 4, 2);
      }
      if (crackLevel > 1) {
        // Lower zig-zag crack
        ctx.fillRect(-6, 4, 4, 2);
        ctx.fillRect(-2, 6, 4, 2);
        ctx.fillRect(2, 4, 4, 2);
        ctx.fillRect(6, 6, 4, 2);
      }

      ctx.restore();
    }

    // ---------- Packs (now Eggs) ----------
    const packs = {
      common: {
        name: "Common Egg",
        cost: 50,
        pool: [
          { id:"sparrow", weight:40 },
          { id:"pigeon", weight:30 },
          { id:"robin", weight:20 },
          { id:"crow", weight:8 },
          { id:"wren", weight:2 }
        ]
      },
      forest: {
        name: "Forest Egg",
        cost: 100,
        pool: [
          { id:"bluejay", weight:40 },
          { id:"woodpecker", weight:30 },
          { id:"chickadee", weight:20 },
          { id:"magpie", weight:8 },
          { id:"canary", weight:2 }
        ]
      },
      exotic: {
        name: "Exotic Egg",
        cost: 200,
        pool: [
          { id:"parrot", weight:40 },
          { id:"toucan", weight:30 },
          { id:"macaw", weight:20 },
          { id:"peacock", weight:8 },
          { id:"flamingo", weight:2 }
        ]
      },
      legendary: {
        name: "Legendary Egg",
        cost: 500,
        pool: [
          { id:"eagle", weight:40 },
          { id:"falcon", weight:30 },
          { id:"owl", weight:20 },
          { id:"hummingbird", weight:8 },
          { id:"kingfisher", weight:2 }
        ]
      },
      ultra: {
        name: "Ultra Egg",
        cost: 1000,
        pool: [
          { id:"kiwi", weight:40 },
          { id:"puffin", weight:30 },
          { id:"swan", weight:20 },
          { id:"cockatoo", weight:8 },
          { id:"stork", weight:2 }
        ]
      }
    };

    // ---------- Difficulty ----------
    let difficulty = "normal";

    const difficultySettings = {
      easy: {
        pipeSpeed: 1.6,
        gap: 170,
        gravity: 0.35,
        lift: -7.5,
        coinMult: 1
      },
      normal: {
        pipeSpeed: 2,
        gap: 140,
        gravity: 0.4,
        lift: -7,
        coinMult: 1
      },
      hard: {
        pipeSpeed: 2.6,
        gap: 120,
        gravity: 0.45,
        lift: -6.5,
        coinMult: 1.5
      }
    };

    // ---------- Game state ----------
    let bird = { x:50, y:150, width:20, height:20, gravity:0.4, lift:-7, velocity:0 };
    let bird2 = { x:80, y:150, width:20, height:20, gravity:0.4, lift:-7, velocity:0 };

    let pipes = [];
    let frame = 0;

    let gameState = "mainMenu";

    let countdown = 3;
    let isMultiplayer = false;

    let score = 0;
    let highScore = Number(localStorage.getItem("flappyHighScore")) || 0;
    let coins = Number(localStorage.getItem("flappyCoins")) || 0;

    let unlockedBirdIds = JSON.parse(localStorage.getItem("flappyUnlockedBirds") || "[]");
    if (unlockedBirdIds.length === 0) {
      unlockedBirdIds = ["sparrow"];
    }
    let equippedBirdId = localStorage.getItem("flappyEquippedBird") || "sparrow";

    let lastRolledBird = null;
    let lastRollNew = false;
    let lastRollPackKey = null;

    let rollAnim = {
      timer: 0,
      phase: "egg",
      stars: []
    };

    let menuButtons = {};
    let indexBackButton = null;
    let shopBackButton = null;
    let packButtons = {};
    let mapButtons = {};
    let settingsButtons = {};
    let jumpButton = { x: canvas.width - 90, y: canvas.height - 90, w: 70, h: 70 };

    let indexScroll = 0;
    let indexScrollMax = 0;

    let indexSortMode = "rarity";
    let indexFilterRarity = "All";

    let jumpParticles = [];

    let jungleLeaves = [];
    let snowflakes = [];
    let neonPulse = 0;
    let crystalSparkles = [];
    let nightFlicker = 0;

    let scorePops = [];

    // ---------- Helpers ----------
    function getBirdById(id) {
      return allBirds.find(b => b.id === id);
    }
    function getEquippedBird() {
      return getBirdById(equippedBirdId) || allBirds[0];
    }
    function getBirdMultiplier() {
      return getEquippedBird().multiplier;
    }
    function saveProgress() {
      localStorage.setItem("flappyHighScore", highScore);
      localStorage.setItem("flappyCoins", coins);
      localStorage.setItem("flappyUnlockedBirds", JSON.stringify(unlockedBirdIds));
      localStorage.setItem("flappyEquippedBird", equippedBirdId);
    }

    function rollFromPack(packKey) {
      const pack = packs[packKey];
      let total = pack.pool.reduce((s,p)=>s+p.weight,0);
      let r = Math.random()*total;
      for (let entry of pack.pool) {
        if (r < entry.weight) return entry.id;
        r -= entry.weight;
      }
      return pack.pool[pack.pool.length-1].id;
    }

    // ---------- Decorations + map animations ----------
    function initMapAnimations() {
      jungleLeaves = [];
      for (let i=0;i<20;i++) {
        jungleLeaves.push({
          x: Math.random()*canvas.width,
          y: Math.random()*canvas.height,
          speed: 0.5 + Math.random()*0.7
        });
      }
      snowflakes = [];
      for (let i=0;i<40;i++) {
        snowflakes.push({
          x: Math.random()*canvas.width,
          y: Math.random()*canvas.height,
          speed: 0.5 + Math.random()*1.0
        });
      }
      crystalSparkles = [];
      for (let i=0;i<25;i++) {
        crystalSparkles.push({
          x: Math.random()*canvas.width,
          y: 350 + Math.random()*200,
          phase: Math.random()*Math.PI*2
        });
      }
      neonPulse = 0;
      nightFlicker = 0;
    }
    initMapAnimations();

    function updateMapAnimations() {
      jungleLeaves.forEach(l => {
        l.y += l.speed;
        if (l.y > canvas.height+10) {
          l.y = -10;
          l.x = Math.random()*canvas.width;
        }
      });
      snowflakes.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height+5) {
          s.y = -5;
          s.x = Math.random()*canvas.width;
        }
      });
      neonPulse += 0.05;
      crystalSparkles.forEach(c => {
        c.phase += 0.05;
      });
      nightFlicker += 0.15;
    }

    function drawDecorations() {
      const deco = maps[selectedMap].deco;

      if (deco === "clouds") {
        ctx.fillStyle = "white";
        // Replace round clouds with blocky clouds
        ctx.fillRect(70, 70, 60, 10);
        ctx.fillRect(60, 80, 80, 10);
        ctx.fillRect(75, 90, 50, 10);
      }

      if (deco === "stars") {
        const flicker = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(nightFlicker));
        ctx.globalAlpha = flicker;
        ctx.fillStyle = "white";
        for (let i = 0; i < 40; i++) {
          ctx.fillRect(Math.random() * canvas.width, Math.random() * 200, 2, 2);
        }
        ctx.globalAlpha = 1;
      }

      if (deco === "lava") {
        ctx.fillStyle = "rgba(255,80,0,0.4)";
        ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      }

      if (deco === "jungleLeaves") {
        ctx.fillStyle = "#2e7d32";
        jungleLeaves.forEach(l => {
          // Blocky leaves instead of ellipse
          ctx.fillRect(l.x - 4, l.y - 6, 8, 12);
        });
      }

      if (deco === "neonCity") {
        ctx.fillStyle = "#120022";
        ctx.fillRect(0, 350, 80, 250);
        ctx.fillRect(90, 320, 60, 280);
        ctx.fillRect(170, 360, 90, 240);
        ctx.fillRect(270, 330, 70, 270);
        ctx.fillRect(350, 370, 50, 230);

        const glow = (Math.sin(neonPulse)+1)/2;
        ctx.fillStyle = `rgba(0,229,255,${0.3+0.4*glow})`;
        for (let x=10;x<400;x+=30) {
          for (let y=360;y<580;y+=25) {
            ctx.fillRect(x, y, 6, 10);
          }
        }
      }

      if (deco === "crystals") {
        ctx.fillStyle = "#0d47a1";
        ctx.fillRect(0, 380, canvas.width, 220);
        crystalSparkles.forEach(c => {
          const alpha = 0.3 + 0.3*Math.sin(c.phase);
          ctx.fillStyle = `rgba(79,195,247,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(c.x, c.y-10);
          ctx.lineTo(c.x+6, c.y);
          ctx.lineTo(c.x, c.y+10);
          ctx.lineTo(c.x-6, c.y);
          ctx.closePath();
          ctx.fill();
        });
      }

      if (deco === "snow") {
        ctx.fillStyle = "#e3f2fd";
        snowflakes.forEach(s => {
          // Blocky snowflakes instead of arcs
          ctx.fillRect(s.x-1, s.y-1, 2, 2);
        });
      }
    }

    // ---------- Bird drawing ----------
    function drawBirdSprite(birdObj, cx, cy) {
      const s = birdObj.sprite;
      ctx.fillStyle = s.body;
      ctx.fillRect(cx-10, cy-10, 20, 20);
      ctx.fillStyle = s.wing;
      ctx.fillRect(cx-12, cy-2, 10, 8);
      ctx.fillStyle = s.eye;
      ctx.fillRect(cx+2, cy-6, 6, 6);
      ctx.fillStyle = s.pupil;
      ctx.fillRect(cx+4, cy-4, 2, 2);
      ctx.fillStyle = s.beak;
      ctx.fillRect(cx+8, cy-2, 6, 4);
      ctx.fillStyle = s.accent;
      ctx.fillRect(cx-6, cy-8, 6, 4);
    }

    function drawBird() {
      drawBirdSprite(getEquippedBird(), bird.x+10, bird.y+10);
    }
    function drawBird2() {
      drawBirdSprite(getEquippedBird(), bird2.x+10, bird2.y+10);
    }

    // ---------- Pipes ----------
    function drawPipe(p) {
      ctx.fillStyle = maps[selectedMap].pipeMain;
      ctx.fillRect(p.x, 0, p.width, p.top);
      ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);

      ctx.fillStyle = maps[selectedMap].pipeLip;
      ctx.fillRect(p.x - 5, p.top - 20, p.width + 10, 20);
      ctx.fillRect(p.x - 5, p.bottomY, p.width + 10, 20);

      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(p.x + p.width - 5, 0, 5, p.top);
      ctx.fillRect(p.x + p.width - 5, p.bottomY, 5, canvas.height - p.bottomY);
    }
    function drawPipes() {
      pipes.forEach(drawPipe);
    }

    // ---------- Jump particles ----------
    function spawnJumpParticles(x, y) {
      const birdObj = getEquippedBird();
      const color = birdObj.sprite.accent;
      for (let i=0;i<8;i++) {
        jumpParticles.push({
          x: x+10,
          y: y+10,
          vx: (Math.random()-0.5)*1.5,
          vy: 1 + Math.random()*1.5,
          life: 30,
          color
        });
      }
    }
    function updateJumpParticles() {
      jumpParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      jumpParticles = jumpParticles.filter(p => p.life>0);
    }
    function drawJumpParticles() {
      jumpParticles.forEach(p => {
        const alpha = p.life/30;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });
    }

    // ---------- Score pops ----------
    function addScorePop(x, y) {
      scorePops.push({ x, y, life: 30 });
    }
    function updateScorePops() {
      scorePops.forEach(s => {
        s.y -= 0.7;
        s.life--;
      });
      scorePops = scorePops.filter(s => s.life>0);
    }
    function drawScorePops() {
      scorePops.forEach(s => {
        const alpha = s.life/30;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        ctx.fillText("+1", s.x, s.y);
        ctx.globalAlpha = 1;
      });
    }

    // ---------- Updates ----------
    function resetGame() {
      bird.y = 150;
      bird.velocity = 0;
      bird2.y = 150;
      bird2.velocity = 0;
      pipes = [];
      frame = 0;
      score = 0;
      jumpParticles = [];
      scorePops = [];

      const d = difficultySettings[difficulty];
      bird.gravity = d.gravity;
      bird.lift = d.lift;
      bird2.gravity = d.gravity;
      bird2.lift = d.lift;

      jumpButton = { x: canvas.width - 90, y: canvas.height - 90, w: 70, h: 70 };
    }

    function updateBirdSingle(b) {
      b.velocity += b.gravity;
      b.y += b.velocity;
      if (b.y + b.height > canvas.height || b.y < 0) {
        endRun();
      }
    }

    function updatePipes() {
      pipes.forEach(p => p.x -= difficultySettings[difficulty].pipeSpeed);

      if (frame % 120 === 0) {
        let gap = difficultySettings[difficulty].gap;
        let top = Math.random() * (canvas.height - gap - 100) + 20;
        pipes.push({
          x: canvas.width + 40,
          width: 40,
          top: top,
          bottomY: top + gap,
          passed: false
        });
      }

      pipes.forEach(p => {
        if (
          bird.x < p.x + p.width &&
          bird.x + bird.width > p.x &&
          (bird.y < p.top || bird.y + bird.height > p.bottomY)
        ) {
          endRun();
        }
        if (isMultiplayer &&
            bird2.x < p.x + p.width &&
            bird2.x + bird2.width > p.x &&
            (bird2.y < p.top || bird2.y + bird2.height > p.bottomY)
        ) {
          endRun();
        }

        if (!p.passed && p.x + p.width < bird.x) {
          p.passed = true;
          score++;
          if (score > highScore) {
            highScore = score;
          }
          addScorePop(p.x, p.top + 20);
        }
      });
    }

    function endRun() {
      gameState = "dead";
      const d = difficultySettings[difficulty];
      const finalScore = Math.floor(score * getBirdMultiplier());
      const earned = Math.floor(score * getBirdMultiplier() * 2 * d.coinMult);
      coins += earned;
      saveProgress();
    }

    // ---------- Bird Index (sortable + filter) ----------
    function getSortedFilteredBirds() {
      let list = allBirds.slice();

      if (indexFilterRarity !== "All") {
        list = list.filter(b => b.rarity === indexFilterRarity);
      }

      if (indexSortMode === "rarity") {
        const order = ["Mythic","Legendary","Epic","Rare","Uncommon","Common"];
        list.sort((a,b) => order.indexOf(a.rarity) - order.indexOf(b.rarity));
      } else if (indexSortMode === "name") {
        list.sort((a,b) => a.name.localeCompare(b.name));
      } else if (indexSortMode === "mult") {
        list.sort((a,b) => b.multiplier - a.multiplier);
      }

      return list;
    }

      ctx.fillText("Bird Index", 110, 60);

      ctx.fillRect(60, 80, 80, 30);
      ctx.fillStyle = "black";
      ctx.fillText("Rarity", 70, 100);

      ctx.fillStyle = indexSortMode === "name" ? "#00e676" : "white";
      ctx.fillRect(150, 80, 80, 30);
      ctx.fillStyle = "black";
      ctx.fillText("Name", 165, 100);

      ctx.fillStyle = indexSortMode === "mult" ? "#00e676" : "white";

      settingsButtons.indexSortRarity = { x:60, y:80, w:80, h:30 };

      ctx.fillStyle = "white";
      ctx.fillText("Filter:", 20, 135);

      ctx.fillStyle = "#ffffff";

      settingsButtons.indexFilter = { x:80, y:120, w:200, h:30 };

      let birdsPerRow = 3;

            ctx.fillText("?", x + boxSize/2 - 5, y + boxSize/2 + 5);

    // ---------- Rarity star burst ----------
    function spawnRarityStars(birdObj) {
      rollAnim.stars = [];
      let count = 5;
      const rarity = birdObj.rarity;
      let color = rarityColors[rarity] || "#ffffff";

      if (rarity === "Common") count = 5;
      else if (rarity === "Uncommon") count = 7;
      else if (rarity === "Rare") count = 9;
      else if (rarity === "Epic") count = 11;
      else if (rarity === "Legendary") count = 13;
      else if (rarity === "Mythic") count = 15;

      for (let i=0;i<count;i++) {
        rollAnim.stars.push({
          x: canvas.width/2,
          y: 260,
          vx: (Math.random()-0.5)*3,
          vy: (Math.random()-0.5)*3,
          life: 40,
          color
        });
      }
    }

    function updateRarityStars() {
      rollAnim.stars.forEach(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
      });
      rollAnim.stars = rollAnim.stars.filter(s => s.life>0);
    }

    function drawRarityStars() {
      rollAnim.stars.forEach(s => {
        const alpha = s.life/40;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s.color;
        // Pixel diamond-ish star
        ctx.fillRect(s.x-2, s.y-4, 4, 2);
        ctx.fillRect(s.x-4, s.y-2, 8, 2);
        ctx.fillRect(s.x-2, s.y, 4, 2);
        ctx.globalAlpha = 1;
      });
    }

    // ---------- Roll screen (egg animation) ----------
    function drawRollScreen() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.font = "32px Arial";
      ctx.fillText("You hatched:", 110, 80);

      if (!lastRolledBird || !lastRollPackKey) return;

      const cx = canvas.width/2;
      const cy = 230;

      const t = rollAnim.timer;

      if (rollAnim.phase === "egg") {
        const shake = Math.sin(t/5)*3;
        drawEggForPack(lastRollPackKey, cx, cy, 0, shake);
      } else if (rollAnim.phase === "crack") {
        const shake = Math.sin(t/3)*4;
        const crackLevel = t > 40 ? 2 : 1;
        drawEggForPack(lastRollPackKey, cx, cy, crackLevel, shake);
      } else if (rollAnim.phase === "reveal") {
        drawEggForPack(lastRollPackKey, cx, cy+10, 2, 0);
        drawBirdSprite(lastRolledBird, cx, cy);
        drawRarityStars();
      }

      if (rollAnim.phase === "reveal") {
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(lastRolledBird.name, 150, 300);

        ctx.fillStyle = rarityColors[lastRolledBird.rarity];
        ctx.fillText(lastRolledBird.rarity, 150, 330);

        ctx.fillStyle = "yellow";
        ctx.fillText("x" + lastRolledBird.multiplier, 150, 360);

        if (lastRollNew) {
          ctx.fillStyle = "#00e676";
          ctx.font = "24px Arial";
          ctx.fillText("NEW!", 170, 390);
        }

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Click to continue", 130, 440);
      } else {
        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Hatching...", 150, 440);
      }
    }

    function updateRollAnimation() {
      if (!lastRolledBird) return;

      rollAnim.timer++;

      if (rollAnim.phase === "egg" && rollAnim.timer > 40) {
        rollAnim.phase = "crack";
        rollAnim.timer = 0;
      } else if (rollAnim.phase === "crack" && rollAnim.timer > 40) {
        rollAnim.phase = "reveal";
        rollAnim.timer = 0;
        spawnRarityStars(lastRolledBird);
      }

      if (rollAnim.phase === "reveal") {
        updateRarityStars();
      }
    }

    // ---------- Countdown ----------
    function countdownTick() {
      countdown--;
      if (countdown > 0) {
        setTimeout(countdownTick, 1000);
      } else {
        gameState = isMultiplayer ? "playingMulti" : "playing";
      }
    }

    // ---------- Input ----------
    document.addEventListener("keydown", (e) => {
      if (gameState === "playing") {
        bird.velocity = bird.lift;
        spawnJumpParticles(bird.x, bird.y);
      } else if (gameState === "playingMulti") {
        if (e.key === "w" || e.key === "W") {
          bird.velocity = bird.lift;
          spawnJumpParticles(bird.x, bird.y);
        }
        if (e.key === "ArrowUp") {
          bird2.velocity = bird2.lift;
          spawnJumpParticles(bird2.x, bird2.y);
        }
      } else if (gameState === "dead") {
        resetGame();
        gameState = "mainMenu";
      }
    });

    canvas.addEventListener("wheel", (e) => {
      if (gameState === "index") {
        indexScroll += e.deltaY * 0.5;
        if (indexScroll < 0) indexScroll = 0;
        if (indexScroll > indexScrollMax) indexScroll = indexScrollMax;
      }
    });

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (gameState === "playing" || gameState === "playingMulti") {
        if (inside(mx,my,jumpButton)) {
          if (gameState === "playing") {
            bird.velocity = bird.lift;
            spawnJumpParticles(bird.x, bird.y);
          } else {
            bird.velocity = bird.lift;
            spawnJumpParticles(bird.x, bird.y);
          }
          return;
        }
      }

      if (gameState === "mainMenu") {
        if (inside(mx,my,menuButtons.single)) {
          resetGame();
          isMultiplayer = false;
          countdown = 3;
          gameState = "countdown";
          setTimeout(countdownTick, 1000);
        } else if (inside(mx,my,menuButtons.multi)) {
          resetGame();
          isMultiplayer = true;
          countdown = 3;
          gameState = "countdown";
          setTimeout(countdownTick, 1000);
        } else if (inside(mx,my,menuButtons.index)) {
          gameState = "index";
        } else if (inside(mx,my,menuButtons.shop)) {
          gameState = "shop";
        } else if (inside(mx,my,menuButtons.map)) {
          gameState = "mapSelect";
        } else if (inside(mx,my,menuButtons.settings)) {
          gameState = "settings";
        }

        if (inside(mx,my,menuButtons.diffEasy)) {
          difficulty = "easy";
        }
        if (inside(mx,my,menuButtons.diffNormal)) {
          difficulty = "normal";
        }
        if (inside(mx,my,menuButtons.diffHard)) {
          difficulty = "hard";
        }

      } else if (gameState === "mapSelect") {
        if (inside(mx,my,{x:20,y:20,w:80,h:40})) {
          gameState = "mainMenu";
          return;
        }
        for (let key of Object.keys(mapButtons)) {
          if (inside(mx,my,mapButtons[key])) {
            selectedMap = key;
            gameState = "mainMenu";
            return;
          }
        }
      } else if (gameState === "index") {
        if (inside(mx,my,indexBackButton)) {
          gameState = "mainMenu";
          return;
        }

        if (inside(mx,my,settingsButtons.indexSortRarity)) {
          indexSortMode = "rarity";
        } else if (inside(mx,my,settingsButtons.indexSortName)) {
          indexSortMode = "name";
        } else if (inside(mx,my,settingsButtons.indexSortMult)) {
          indexSortMode = "mult";
        } else if (inside(mx,my,settingsButtons.indexFilter)) {
          const order = ["All","Common","Uncommon","Rare","Epic","Legendary","Mythic"];
          let idx = order.indexOf(indexFilterRarity);
          idx = (idx + 1) % order.length;
          indexFilterRarity = order[idx];
        } else {
          let birdsPerRow = 3;
          let boxSize = 90;
          let padding = 20;
          let startX = 20;
          let startY = 170;

          const birdsToShow = getSortedFilteredBirds();

          for (let i=0;i<birdsToShow.length;i++) {
            let col = i % birdsPerRow;
            let row = Math.floor(i / birdsPerRow);

            let x = startX + col * (boxSize + padding);
            let y = startY + row * (boxSize + 70) - indexScroll;

            let box = { x:x, y:y, w:boxSize, h:boxSize };

            if (inside(mx,my,box)) {
              const b = birdsToShow[i];
              if (unlockedBirdIds.includes(b.id)) {
                equippedBirdId = b.id;
                saveProgress();
              }
            }
          }
        }

      } else if (gameState === "shop") {
        if (inside(mx,my,shopBackButton)) {
          gameState = "mainMenu";
          return;
        }
        for (let key of Object.keys(packButtons)) {
          if (inside(mx,my,packButtons[key])) {
            const pack = packs[key];
            if (coins >= pack.cost) {
              coins -= pack.cost;
              const birdId = rollFromPack(key);
              const birdObj = getBirdById(birdId);
              lastRolledBird = birdObj;
              lastRollPackKey = key;
              if (!unlockedBirdIds.includes(birdId)) {
                unlockedBirdIds.push(birdId);
                lastRollNew = true;
              } else {
                lastRollNew = false;
              }
              saveProgress();
              rollAnim.timer = 0;
              rollAnim.phase = "egg";
              rollAnim.stars = [];
              gameState = "roll";
            }
          }
        }
      } else if (gameState === "roll") {
        if (rollAnim.phase === "reveal") {
          gameState = "shop";
        }
      } else if (gameState === "settings") {
        if (inside(mx,my,{x:20,y:20,w:80,h:40})) {
          gameState = "mainMenu";
          return;
        }
        if (inside(mx,my,settingsButtons.size1)) {
          canvas.width = 400;
          canvas.height = 600;
          resetGame();
          initMapAnimations();
        }
        if (inside(mx,my,settingsButtons.size2)) {
          canvas.width = 500;
          canvas.height = 750;
          resetGame();
          initMapAnimations();
        }
        if (inside(mx,my,settingsButtons.size3)) {
          canvas.width = 600;
          canvas.height = 900;
          resetGame();
          initMapAnimations();
        }
      }
    });

    function inside(mx,my,btn) {
      if (!btn) return false;
      return mx > btn.x && mx < btn.x+btn.w && my > btn.y && my < btn.h+btn.y;
    }

    // ---------- Main loop ----------
    function loop() {
      updateMapAnimations();

      if (gameState === "mainMenu") {
        drawMainMenu();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "mapSelect") {
        drawMapSelect();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "index") {
        drawBirdIndex();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "shop") {
        drawShop();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "roll") {
        updateRollAnimation();
        drawRollScreen();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "settings") {
        drawSettings();
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      ctx.fillStyle = maps[selectedMap].bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawDecorations();

      if (gameState === "countdown") {
        drawCountdown(countdown);
        frame++;
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === "playing") {
        drawBird();
        drawPipes();
        updateBirdSingle(bird);
        updatePipes();
        updateJumpParticles();
        updateScorePops();
        drawJumpParticles();
        drawScorePops();
        drawScore();
        drawCoins();
        drawJumpButton();
        frame++;
      }

      if (gameState === "playingMulti") {
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "14px Arial";
        ctx.fillText("P1 (W)", 10, 20);
        ctx.fillText("P2 (↑)", canvas.width-70, 20);

        drawBird();
        drawBird2();
        drawPipes();
        updateBirdSingle(bird);
        updateBirdSingle(bird2);
        updatePipes();
        updateJumpParticles();
        updateScorePops();
        drawJumpParticles();
        drawScorePops();
        drawScore();
        drawCoins();
        drawJumpButton();
        frame++;
      }

      if (gameState === "dead") {
        drawDeathScreen();
        frame++;
      }

      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>
</body>
</html>
